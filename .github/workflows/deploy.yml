# فحص تلقائي مع كل دفع إلى main: سلامة الجدول المعتمد، والدخان، والحفظ.
# النشر يتولاه Render تلقائياً (Auto-Deploy عبر تطبيق Render على GitHub).
name: فحص

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-latest
    env:
      TIMETABLE_LOCK: "1"
      DATA_DIR: /tmp/school-ci
      PYTHONIOENCODING: utf-8
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -r requirements.txt
      - name: سلامة الجدول المعتمد
        run: python tools/verify_timetable.py --strict --rules
      - name: تشغيل الخادم
        run: |
          mkdir -p "$DATA_DIR"
          uvicorn app:app --port 8765 > /tmp/server.log 2>&1 &
          for i in $(seq 1 30); do curl -sf http://127.0.0.1:8765/healthz && break; sleep 1; done
      - name: اختبار الدخان
        run: python tests/smoke_test.py http://127.0.0.1:8765
      - name: اختبار الحفظ
        run: python tests/persistence_test.py http://127.0.0.1:8765
      - name: سجل الخادم عند الفشل
        if: failure()
        run: cat /tmp/server.log
